name: Foundry test

on:
  pull_request:

jobs:
  test:
    name: Foundry build n test
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p /tmp/content
          printf '1\n' > /tmp/content/pr_number.txt
          echo "attacker report" > '/tmp/content/$(id)$(hostname).txt'
          ls -la /tmp/content
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: content
          path: /tmp/content
